# Configuración de ros2_control para las dos articulaciones del cuello.
controller_manager:
  ros__parameters:
    update_rate: 100          # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    neck_controller:
      type: joint_trajectory_controller/JointTrajectoryController

neck_controller:
  ros__parameters:
    joints:
      - neck_yaw_joint
      - neck_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
